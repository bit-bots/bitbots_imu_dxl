[package]
edition = "2021"
name    = "bitbots_imu_firmware"
version = "0.1.0"

[[bin]]
name = "bitbots_imu_firmware"
path = "./src/main.rs"

[dependencies]
critical-section = "1.2.0"
esp-backtrace = { version = "0.15.0", features = [
  "esp32",
  "exception-handler",
  "panic-handler",
  "println",
  "custom-halt",
] }
esp-hal = { version = "0.23.1", features = ["esp32", "unstable"] }
esp-println = { version = "0.13.0", features = ["esp32", "log"] }
log = { version = "0.4.21" }
dynamixel2 = { git = "https://github.com/Flova/dynamixel2-rs.git", branch = "main", default-features = false }
embedded-io = "0.6.1"
defmt = "0.3.10"
esp-storage = { version = "0.4.0", features = ["esp32", "storage"] }
embedded-storage = "0.3.1"
serde = { version = "1.0.217", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"
heapless = { version = "0.8.0", features = ["serde"] }
embedded-hal-bus = "0.3.0"
esp-hal-smartled = { git = "https://github.com/esp-rs/esp-hal-community", rev = "ad75112" }
smart-leds = "0.4.0"
embedded-hal = "1.0.0"
imu-fusion = "0.2.5"
bmi088 = { git = "https://github.com/bit-bots/bmi088", version = "0.2.0" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[features]
profiling = []
